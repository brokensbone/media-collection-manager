version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Update the resolved environment, without raising supported minimums on
  # every release. Nix may legitimately package an older compatible version.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # Keeps the flake's inputs current. flake.lock only — a version pinned inside
  # flake.nix, like the typesafe-sdk wheel, is still ours to bump.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
