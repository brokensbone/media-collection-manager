# Disposable local beets config (D10). The real deploy points BEETSDIR at your existing beets
# directory instead — nothing here is special. Paths are relative to BEETSDIR (/beets), a mounted
# volume, so they survive `docker compose restart` but are thrown away with `docker compose down -v`.
directory: ./music
library: ./library.db

# Non-interactive import (§12/§13): the app runs `beet import -q`. Without this, a drop that
# beets can't confidently autotag would be *skipped* in quiet mode; `asis` imports it anyway
# (keeping its existing tags) so the Import action always lands something.
import:
  quiet_fallback: asis
  write: yes
