# Disposable local deploy (D10). Brings up Postgres + the app (API+SPA on one origin) + the
# poller worker, all on local volumes. Run from this directory (deploy/local):
#   cp .env.example .env      # then optionally add Spotify creds
#   docker compose up -d --build
# Then open http://localhost:8000  (health: /health, metrics: /metrics)
# Tear down and wipe data:  docker compose down -v

x-app: &app
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  image: mcm-local:latest
  env_file: .env
  environment:
    # --- infra wiring for this local deploy (the real deploy sets these to its own values) ---
    MCM_DATABASE_URL: postgresql+psycopg://mcm:mcm@postgres:5432/mcm
    BEETSDIR: /beets  # beets reads its config.yaml + library from here
    MCM_IMPORT_INBOX_PATH: /beets/inbox
    MCM_STATIC_DIR: /app/frontend-dist  # api serves the SPA; worker ignores it
    # --- watch-dir import (§13): drop albums/zips into ./watchdir on the host to test ---
    MCM_WATCHDIR_PATH: /watchdir
    MCM_WATCHDIR_POLL_SECONDS: "30"   # snappy for testing (real default 300)
    MCM_WATCHDIR_SETTLE_SECONDS: "5"  # snappy for testing (real default 60)
    # --- Transmission auto-land (§12): set the RPC/SSH vars in .env to enable. Also uncomment
    #     the SSH key mount below and set MCM_TRANSMISSION_SSH_KEY=/keys/id in .env. ---
    MCM_TRANSMISSION_POLL_SECONDS: "60"  # snappy for testing (real default 3600)
  volumes:
    - beetsdata:/beets
    - ./beets/config.yaml:/beets/config.yaml:ro  # config lives in BEETSDIR
    - ./watchdir:/watchdir  # host ./watchdir <-> container /watchdir
    - ~/.ssh/ucc:/keys/id:ro   # uncomment to give rsync a key for the seedbox (§12)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mcm
      POSTGRES_PASSWORD: mcm
      POSTGRES_DB: mcm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcm"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations and materialise an empty beets library, before api/worker start.
  init:
    <<: *app
    restart: "no"
    command:
      - sh
      - -c
      - "alembic upgrade head && mkdir -p /beets/music /beets/inbox && (beet ls >/dev/null 2>&1 || true)"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "mcm.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully

volumes:
  pgdata:
  beetsdata:
