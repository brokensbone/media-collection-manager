# Real deploy: the app (API+SPA on one origin) + the poller worker, in Docker on blink.
# Postgres is NOT here — it lives on partridge and is reached over the LAN (provisioned by
# nixos/hosts/partridge/wantlist-db.nix in the lab repo). The beets library is the real,
# existing one, bind-mounted at its own absolute path so the paths beets records stay valid
# (see the "host-consistent paths" note in deploy/README.md).
#
# Run from this directory (deploy/prod):
#   cp .env.example .env      # then fill in the placeholders
#   docker compose up -d --build
#
# Tear down (data lives on partridge + the host bind mounts, so nothing is lost):
#   docker compose down

x-app: &app
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  image: wantlist:latest
  env_file: .env
  environment:
    WANTLIST_STATIC_DIR: /app/frontend-dist  # api serves the SPA; worker ignores it
    BEETSDIR: ${WANTLIST_BEETS_DIR}  # beets reads config.yaml + library from here
  # Local to blink (not in the repo compose): keep worker/init off Traefik; only api is proxied.
  labels:
    traefik.enable: "false"
  restart: unless-stopped
  volumes:
    # Beets library, mounted at the SAME absolute path host<->container so library.db paths
    # resolve everywhere (see deploy/README.md). ${WANTLIST_BEETS_DIR} is BEETSDIR (holds
    # config.yaml + library.db); ${WANTLIST_MUSIC_DIR} is where the music lives (beets `directory:`).
    - ${WANTLIST_MUSIC_DIR}:${WANTLIST_MUSIC_DIR}
    - ${WANTLIST_BEETS_DIR}:${WANTLIST_BEETS_DIR}
    # Watch-dir import (§13): drop albums/zips here on the host.
    - ${WANTLIST_WATCHDIR_PATH}:${WANTLIST_WATCHDIR_PATH}
    # Transmission auto-land (§12): give rsync the seedbox SSH key. Uncomment and set
    # WANTLIST_TRANSMISSION_SSH_KEY=/keys/id in .env once you wire up Transmission.
    - ${WANTLIST_SSH_KEY}:/keys/id:ro
    # TV/film import destinations (Jellyfin's libraries on /mnt/redhdd). Mounted rw at the SAME
    # absolute path host<->container so the classifier's destination_path (built from tv_root/
    # film_root) is valid both inside the worker and on disk. The worker runs as root, so it can
    # write regardless of the media dirs' ownership.
    - ${WANTLIST_TV_ROOT}:${WANTLIST_TV_ROOT}
    - ${WANTLIST_FILM_ROOT}:${WANTLIST_FILM_ROOT}
    - ${WANTLIST_WORKSPACE_ROOT}:${WANTLIST_WORKSPACE_ROOT}

services:
  # One-shot: apply migrations against the partridge database before api/worker start. The real
  # beets library already exists, so (unlike the local deploy) this creates nothing.
  init:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *app
    # blink local: Traefik discovers Docker labels and proxies over its own Docker network,
    # terminating TLS for wantlist.b.alcachofa.faith. (Repo compose binds 127.0.0.1:8000 instead.)
    labels:
      traefik.enable: "true"
      traefik.docker.network: docker_default
      traefik.http.routers.wantlist.rule: Host(`wantlist.b.alcachofa.faith`)
      traefik.http.services.wantlist.loadbalancer.server.port: "8000"
    networks:
      - default
      - traefik
    depends_on:
      init:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "wantlist.worker"]
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  traefik:
    external: true
    name: docker_default
